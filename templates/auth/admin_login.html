{% extends "base.html" %}

{% block title %}Admin Login | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 admin-login-card">
            <div class="card-header bg-dark text-white text-center py-3">
                <h2 class="h4 mb-0">Administrator Portal</h2>
            </div>
            <div class="card-body p-4">
                <p class="text-center text-muted mb-4">Secure access for system administrators</p>

                <form method="POST" action="{{ url_for('auth.admin_login') }}" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Admin Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email or '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Admin Login</button>
                </form>

                <hr class="my-4">
                <div class="text-center mb-3">
                    <span class="text-muted small">Need an administrator account?</span><br>
                    <a href="{{ url_for('register_admin') }}" class="btn btn-outline-success btn-sm mt-1 fw-semibold">
                        <i class="bi bi-shield-plus me-1"></i> Register New Admin
                    </a>
                </div>
                <p class="text-center mb-0 small">
                    <a href="{{ url_for('auth.login') }}">Citizen Login</a>
                    &middot;
                    <a href="{{ url_for('auth.staff_login') }}">Staff Login</a>
                    &middot;
                    <a href="{{ url_for('home') }}">Home</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
