{% extends "base.html" %}

{% block title %}Staff Login | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 staff-login-card">
            <div class="card-header bg-secondary text-white text-center py-3">
                <h2 class="h4 mb-0">Staff Portal</h2>
            </div>
            <div class="card-body p-4">
                <p class="text-center text-muted mb-4">Sign in to manage your counter and serve tokens</p>

                <form method="POST" action="{{ url_for('auth.staff_login') }}" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Staff Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email or '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-secondary w-100">Staff Login</button>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0 small">
                    <a href="{{ url_for('auth.login') }}">Citizen Login</a>
                    &middot;
                    <a href="{{ url_for('auth.admin_login') }}">Admin Login</a>
                    &middot;
                    <a href="{{ url_for('home') }}">Home</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
