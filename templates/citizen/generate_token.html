{% extends "base.html" %}

{% block title %}Get Token | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="card-title mb-0 fw-bold"><i class="bi bi-ticket-perforated me-2"></i> Generate Queue Token</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('citizen.generate_token') }}" id="tokenForm">
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Select Government Office</label>
                        <select name="office_id" id="officeSelect" class="form-select form-select-lg" required>
                            <option value="">-- Choose Office --</option>
                            {% for off in offices %}
                            <option value="{{ off.id }}" {% if selected_office_id == off.id %}selected{% endif %}>
                                {{ off.office_name }} ({{ off.city }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">2. Select Department</label>
                        <select name="department_id" id="deptSelect" class="form-select form-select-lg" required>
                            <option value="">-- Choose Department --</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" data-office="{{ dept.office_id }}" {% if selected_dept_id == dept.id %}selected{% endif %}>
                                {{ dept.department_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">3. Select Service</label>
                        <select name="service_id" id="serviceSelect" class="form-select form-select-lg" required>
                            <option value="">-- Choose Service --</option>
                            {% for srv in services %}
                            <option value="{{ srv.id }}" data-dept="{{ srv.department_id }}" data-office="{{ srv.office_id }}" data-avg="{{ srv.average_time }}" data-limit="{{ srv.daily_limit }}" {% if selected_service_id == srv.id %}selected{% endif %}>
                                {{ srv.service_name }} (Avg {{ srv.average_time }} min)
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div id="serviceInfo" class="alert alert-info d-none mb-4">
                        <div class="fw-bold"><i class="bi bi-info-circle me-1"></i> Service Details</div>
                        <div id="infoText" class="small mt-1"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Generate Token Now
                        </button>
                        <a href="{{ url_for('citizen.citizen_index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const officeSelect = document.getElementById('officeSelect');
    const deptSelect = document.getElementById('deptSelect');
    const serviceSelect = document.getElementById('serviceSelect');
    const serviceInfo = document.getElementById('serviceInfo');
    const infoText = document.getElementById('infoText');

    function filterDepts() {
        const selectedOffice = officeSelect.value;
        Array.from(deptSelect.options).forEach(opt => {
            if (!opt.value) return;
            const match = !selectedOffice || opt.dataset.office === selectedOffice;
            opt.hidden = !match;
            if (!match && opt.selected) deptSelect.value = '';
        });
        filterServices();
    }

    function filterServices() {
        const selectedDept = deptSelect.value;
        const selectedOffice = officeSelect.value;

        Array.from(serviceSelect.options).forEach(opt => {
            if (!opt.value) return;
            const deptMatch = !selectedDept || opt.dataset.dept === selectedDept;
            const officeMatch = !selectedOffice || opt.dataset.office === selectedOffice;
            const match = deptMatch && officeMatch;
            opt.hidden = !match;
            if (!match && opt.selected) serviceSelect.value = '';
        });
        updateServiceInfo();
    }

    function updateServiceInfo() {
        const selectedOpt = serviceSelect.options[serviceSelect.selectedIndex];
        if (selectedOpt && selectedOpt.value) {
            const avg = selectedOpt.dataset.avg || '15';
            const limit = selectedOpt.dataset.limit || '100';
            infoText.innerHTML = `Average service duration: <strong>${avg} minutes</strong> per citizen. Daily token limit: <strong>${limit}</strong>.`;
            serviceInfo.classList.remove('d-none');
        } else {
            serviceInfo.classList.add('d-none');
        }
    }

    officeSelect.addEventListener('change', filterDepts);
    deptSelect.addEventListener('change', filterServices);
    serviceSelect.addEventListener('change', updateServiceInfo);

    filterDepts();
});
</script>
{% endblock %}
