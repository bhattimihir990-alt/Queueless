{% extends "base.html" %}

{% block title %}400 - Bad Request | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="card border-0 shadow-sm p-4 p-md-5">
            <div class="card-body">
                <div class="text-warning mb-3">
                    <i class="bi bi-exclamation-triangle-fill" style="font-size: 4.5rem;"></i>
                </div>
                <h1 class="display-5 fw-bold text-dark">400</h1>
                <h3 class="h4 fw-bold text-secondary mb-3">Bad Request</h3>
                <p class="text-muted mb-4">
                    The request could not be processed due to invalid or malformed data.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('home') }}" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
